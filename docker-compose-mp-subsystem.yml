name: message_proxy_subsystem
services:
  postgres:
    # container_name: postgres
    image: postgres:17
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=message_proxy
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=${POSTGRES_USER} --dbname=message_proxy"]
      interval: 5s
      retries: 5
      start_period: 30s
      timeout: 10s
    # restart: always
    volumes:
      - pgData:/var/lib/postgresql/data
      - ./docker/postgres/init/:/docker-entrypoint-initdb.d/:ro
  migrate:
    # container_name: migrate
    build:
      context: ./message_proxy/
      dockerfile: Dockerfile.sqlx-init
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/message_proxy?sslmode=disable
  otel_collector_contrib_pg_agent:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-pg
    command:
      - --config=/etc/config.yml
    volumes:
      - ./docker/otel-collector-pg/config.yaml:/etc/config.yml:ro
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=message_proxy
      - OTEL_COLLECTOR_GATEWAY_OTLP_ENDPOINT=otel-collector:4317
      - HYPERDX_INGESTION_KEY=${HYPERDX_INGESTION_KEY}
    # TODO: this health check always fails because wget is not
    # available inside the otel collector contrib docker container
    # update it to use some other mechanism
    # healthcheck:
    #   test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:13133"]
    #   interval: 5s
    #   retries: 5
    #   start_period: 60s
    #   timeout: 5s
    networks:
      - default
      # - telemetry
    depends_on:
      postgres:
        condition: service_healthy
  prometheus:
    image: prom/prometheus
    container_name: prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--web.enable-otlp-receiver'
      - '--log.level=debug'
      # otlp receiver flag enables an endpoint on the prometheus instance that receives metrics pushed from
      # the otel collector using the otel format over http. This is different form remote write because
      # remote write uses the prometheus format and not the otel metrics format
    ports:
      - 9090:9090
    restart: unless-stopped
    volumes:
      - ./docker/prometheus:/etc/prometheus
      - promData:/prometheus
  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - ./docker/grafana/local-dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      # - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
      - GF_LOG_LEVEL=warn 
    ports:
      - "3030:3000"
  message_proxy:
    # container_name: message_proxy
    build:
      context: ./message_proxy/
      dockerfile: Dockerfile
    ports:
      - "3000-3001:3000"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASS=${POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=message_proxy
      - OTEL_EXPORTER_CH_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_EXPORTER_PROM_OTLP_ENDPOINT=http://otel-collector-pg:4317
      - HYPERDX_INGESTION_KEY=${HYPERDX_INGESTION_KEY}
      - RUST_LOG=debug
      - RUST_LOG_MP_MODULE=debug
      - CLIENT_ID_FILTERING_ENABLED=true
      - RUST_BACKTRACE=full
      - OTEL_METRIC_EXPORT_INTERVAL=5000
      # ^ in milliseconds
      - NATS_CORE_HOST=nats
      - NATS_CORE_PORT=4222
    networks:
      - default
      - telemetry
      - nats
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      mode: replicated
      replicas: 2
  nats:
    image: nats
    ports:
      - "8222:8222"
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --http_port 8222 "
    networks: ["nats"]
  nats-1:
    image: nats
    # we can set the use and password using nats-server.conf
    command: "--cluster_name NATS --cluster nats://0.0.0.0:6222 --routes=nats://ruser:T0pS3cr3t@nats:6222"
    networks: ["nats"]
    depends_on: ["nats"]

networks:
  nats:
    name: nats
  telemetry:
    name: clickstack_subsystem_telemetry
    external: true

volumes:
  pgData:
  promData:
